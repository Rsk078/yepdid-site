<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Join on Yepdid</title>
  <meta name="theme-color" content="#F4FBF2">
  <link rel="icon" href="/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <!--
    An invite link (yepdid.com/join?t=…). With the Yepdid app installed (and a build that claims
    yepdid.com), the phone opens the app and this page never loads. Otherwise:
    - iPhone: the App Store. After installing, signing in with the invited address shows the invite.
    - Android: the app if it's there (intent://, also when app links aren't verified), else Play,
      with the token in the install referrer, which the app reads on first open.
    - A computer: both stores, or the web app.
  -->
  <script>
    (function () {
      var q = location.search;
      var m = /[?&]t=([A-Za-z0-9_-]{32,128})/.exec(q);
      var t = m ? m[1] : "";
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var android = /Android/.test(ua);
      var appStore = "https://apps.apple.com/app/id6834288221";
      var play = "https://play.google.com/store/apps/details?id=com.yepdid.app" +
        (t ? "&referrer=" + encodeURIComponent("yepdid_invite=" + t) : "");
      var openAndroid = "intent://join" + (t ? "?t=" + t : "") +
        "#Intent;scheme=yepdid;package=com.yepdid.app;S.browser_fallback_url=" +
        encodeURIComponent(play) + ";end";
      window.yepdidJoin = {
        ios: ios,
        android: android,
        appStore: appStore,
        play: play,
        openAndroid: openAndroid,
        openIos: "yepdid://join" + (t ? "?t=" + t : ""),
        web: "https://app.yepdid.com/join" + q,
      };
      if (ios) location.replace(appStore);
      else if (android) location.replace(openAndroid);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4FBF2; color: #060E28;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 420px; padding: 32px 24px; text-align: center; }
    img { border-radius: 16px; }
    h1 { font-size: 24px; line-height: 1.25; margin: 20px 0 8px; }
    p { font-size: 16px; line-height: 1.5; color: #4A5370; margin: 0 0 24px; }
    .buttons { display: grid; gap: 12px; }
    a.button { display: block; padding: 14px 28px; border-radius: 999px; background: #060E28; color: #FFFFFF;
      font-weight: 700; text-decoration: none; }
    a.quiet { color: #4A5370; font-size: 15px; margin-top: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="/img/apple-touch-icon.png" width="64" height="64" alt="Yepdid">
    <h1>You're invited to Yepdid</h1>
    <p>Get the app, then sign in with the email address this invite came to. Your invite will be waiting: one tap and you're paired.</p>
    <div class="buttons">
      <a class="button" id="open" hidden>Open Yepdid</a>
      <a class="button" id="app-store" hidden>Get it on the App Store</a>
      <a class="button" id="play" hidden>Get it on Google Play</a>
      <a class="quiet" id="web" href="https://app.yepdid.com/join">Or use Yepdid in your browser</a>
    </div>
    <noscript><p>Turn on JavaScript, or open Yepdid and enter the code from the email.</p></noscript>
  </main>
  <script>
    (function () {
      var j = window.yepdidJoin;
      function show(id, href) {
        var a = document.getElementById(id);
        a.href = href;
        a.hidden = false;
      }
      document.getElementById("web").href = j.web;
      if (j.android) {
        show("open", j.openAndroid);
        show("play", j.play);
      } else if (j.ios) {
        show("app-store", j.appStore);
        show("open", j.openIos);
        document.getElementById("open").textContent = "I already have Yepdid";
      } else {
        show("app-store", j.appStore);
        show("play", j.play);
      }
    })();
  </script>
</body>
</html>
